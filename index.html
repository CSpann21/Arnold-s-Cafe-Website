<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arnold's Cafe — Coming Soon</title>
<meta name="description" content="Arnold's Cafe is opening soon. A colorful European bistro experience.">

<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="favicon-180.png">

<!-- ============================================================
     EASY-EDIT ZONE
     Change the text below whenever your status changes.
     No other part of this file needs to be touched for content updates.
     ============================================================ -->
<script>
  window.SITE_CONFIG = {
    STATUS: "coming_soon",              // change to "open" when you launch
    HEADLINE_COMING_SOON: "Coming soon to Oklahoma City's Plaza District.",
    HEADLINE_OPEN: "We're open. Come say hello.",
    SUBTEXT_COMING_SOON: "A space for people to connect. Come enjoy consistent quality coffee and baked goods.",
    SUBTEXT_OPEN: "Pastries, strong coffee, and a seat with your name on it. Come find us.",
    OPENING_WINDOW: "Opening Early Fall 2026",
    ADDRESS: "1625 NW 16th, Suite B",
    CITY_STATE: "Oklahoma City, OK",           // update if this isn't right
    EMAIL: "arnoldscafeokc@gmail.com",
    INSTAGRAM_HANDLE: "@arnoldscafeokc",
    INSTAGRAM_URL: "https://instagram.com/arnoldscafeokc",
    HOURS: [
      // Only used once STATUS is "open" — add/edit as many lines as you like
      { day: "Mon – Fri", time: "7:00 AM – 6:00 PM" },
      { day: "Sat", time: "8:00 AM – 6:00 PM" }
    ]
  };
</script>
<!-- ============================================================
     END EASY-EDIT ZONE
     ============================================================ -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500;1,9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  /* Load local uploaded font */
  @font-face {
    font-family: 'TAYRoony';
    src: url('TAYRoony.woff') format('woff');
    font-weight: normal;
    font-style: normal;
    font-display: swap;
  }

  :root {
    --cream: #fdfdc1;
    --cream-soft: #fffef0;
    --rust: #8f1402;
    --sky: #cce6f7;
    --cobalt: #0154f5;
    --chartreuse: #c1cc26;
    --plum: #411638;

    /* Use the uploaded TAYRoony font for display and body */
    --font-display: 'TAYRoony', Georgia, serif;
    --font-body: 'TAYRoony', -apple-system, sans-serif;
  }

  * { box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    margin: 0;
    background: var(--cream);
    color: var(--plum);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  a { color: var(--cobalt); }
  a:focus-visible, button:focus-visible, input:focus-visible {
    outline: 3px solid var(--cobalt);
    outline-offset: 3px;
  }

  /* ---------- Awning stripe signature element ---------- */
  .awning {
    width: 100%;
    height: 34px;
    display: flex;
  }
  .awning span {
    flex: 1 1 0;
    height: 100%;
  }
  .awning span:nth-child(6n+1) { background: var(--rust); }
  .awning span:nth-child(6n+2) { background: var(--rust); }
  .awning span:nth-child(6n+3) { background: var(--cobalt); }
  .awning span:nth-child(6n+4) { background: var(--cobalt); }
  .awning span:nth-child(6n+5) { background: var(--chartreuse); }
  .awning span:nth-child(6n+6) { background: var(--chartreuse); }

  .awning--bottom {
    position: relative;
    margin-top: 24px;
  }
  .awning--bottom::after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: -14px;
    height: 14px;
    background:
      radial-gradient(circle at 50% 0, transparent 0 8px, var(--plum) 9px 100%) 0 0 / 28px 100% repeat-x;
  }
  .awning--bottom { background: var(--plum); }
  .awning--bottom .stripe-row { display:flex; height:34px; }
  .awning--bottom .stripe-row span { flex:1 1 0; }
  .awning--bottom .stripe-row span:nth-child(6n+1) { background: var(--rust); }
  .awning--bottom .stripe-row span:nth-child(6n+2) { background: var(--rust); }
  .awning--bottom .stripe-row span:nth-child(6n+3) { background: var(--cobalt); }
  .awning--bottom .stripe-row span:nth-child(6n+4) { background: var(--cobalt); }
  .awning--bottom .stripe-row span:nth-child(6n+5) { background: var(--chartreuse); }
  .awning--bottom .stripe-row span:nth-child(6n+6) { background: var(--chartreuse); }

  /* ---------- Layout ---------- */
  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 0 24px;
  }

  .hero {
    padding: 72px 0 56px;
    text-align: center;
  }

.gallery {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
    padding: 0 24px 56px;
  }

  .gallery-item {
    margin: 0;
  }

  .gallery-item img {
    width: 100%;
    height: 280px;
    object-fit: cover;
    border-radius: 14px;
    display: block;
  }

  .gallery-item figcaption {
    margin-top: 8px;
    font-size: 0.85rem;
    color: var(--plum);
    text-align: center;
  }

  @media (max-width: 480px) {
    .gallery-item img { height: 220px; }
  }

  .logo {
    width: 440px;
    max-width: 85vw;
    height: auto;
    aspect-ratio: 2.3 / 1;
    object-fit: contain;
    margin: 0 auto 8px;
    display: block;
}

  .eyebrow {
    display: inline-block;
    font-family: var(--font-body);
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    font-size: 13px;
    color: var(--rust);
    background: var(--cream);
    padding: 7px 16px;
    border-radius: 100px;
    margin-bottom: 22px;
  }
  h1 {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: clamp(2.1rem, 5.5vw, 3.4rem);
    line-height: 1.08;
    color: var(--rust);
    margin: 0 0 20px;
    letter-spacing: -0.01em;
  }

  h1 em {
    font-style: italic;
    font-weight: 500;
    color: var(--cobalt);
  }

  .sub {
    font-size: 1.15rem;
    line-height: 1.55;
    color: var(--plum);
    max-width: 460px;
    margin: 0 auto 32px;
  }

  .meta-row {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    margin-bottom: 8px;
  }

  .pill {
    font-size: 0.92rem;
    font-weight: 500;
    padding: 8px 16px;
    border-radius: 100px;
    background: var(--cream-soft);
    border: 1.5px solid var(--rust);
    color: var(--rust);
  }

  .pill--solid {
    background: var(--rust);
    color: var(--cream-soft);
    border-color: var(--rust);
  }

  /* ---------- Contact section ---------- */
  .contact {
    padding: 44px 0 60px;
    text-align: center;
  }

  .contact h2 {
    font-family: var(--font-display);
    font-style: body;
    font-weight: 500;
    font-size: 1.5rem;
    color: var(--plum);
    margin: 0 0 18px;
  }

  .contact-links {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 14px 24px;
    font-size: 1rem;
    font-weight: 500;
  }

  .contact-links a {
    color: var(--plum);
    text-decoration: none;
    border-bottom: 2px solid var(--chartreuse);
    padding-bottom: 2px;
    transition: color 0.15s ease, border-color 0.15s ease;
  }
  .contact-links a:hover {
    color: var(--cobalt);
    border-color: var(--cobalt);
  }

  /* ---------- Hours (shown only when open) ---------- */
  .hours {
    display: none;
    max-width: 320px;
    margin: 0 auto 40px;
    text-align: left;
    background: var(--cream-soft);
    border-radius: 14px;
    padding: 20px 24px;
  }
  .hours-row {
    display: flex;
    justify-content: space-between;
    padding: 7px 0;
    font-size: 0.95rem;
    border-bottom: 1px solid var(--sky);
  }
  .hours-row:last-child { border-bottom: none; }
  .hours-row .day { font-weight: 600; color: var(--rust); }

  footer {
    background: var(--plum);
    color: var(--cream-soft);
    text-align: center;
    padding: 26px 0 30px;
    font-size: 0.85rem;
  }
  footer a { color: var(--cream-soft); text-decoration: underline; }

  @media (max-width: 480px) {
    .hero { padding: 52px 0 40px; }
    .logo { width: 300px; max-width: 88vw; margin-bottom: 8px; }
  }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
  }
</style>
</head>
<body>

  <div class="awning" aria-hidden="true">
    <span></span><span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span><span></span>
  </div>

  <main class="wrap hero">
    <img src="ArnoldsCafe.png" alt="Arnold's Cafe logo" class="logo">

    <span class="eyebrow" id="eyebrow"></span>

    <h1 id="headline"></h1>

    <p class="sub" id="subtext"></p>

    <div class="meta-row">
      <span class="pill pill--solid" id="opening-pill"></span>
      <span class="pill" id="location-pill"></span>
    </div>
  </main>
     <!-- ============================================================
       PHOTO ZONE — add your own images here.
       Each <figure> is one photo. Add or remove as many as you like.
       ============================================================ -->
  <section class="gallery wrap">
    <figure class="gallery-item">
      <img src="redpeople.png" alt="A hand-drawn photo of a girl and a boy sitting at a table enjoying coffee">
      <figcaption>Optional caption</figcaption>
    </figure>

     <!-- Copy the block above to add more photos -->
  <div class="wrap">
    <div class="hours" id="hours"></div>
  </div>

  <section class="contact wrap">
    <h2>We're Hiring!</h2>   
    <h2>Feel Free to reach out</h2>
    <div class="contact-links">
      <a id="email-link" href="#"></a>
      <a id="instagram-link" href="#" target="_blank" rel="noopener"></a>
    </div>
  </section>

  <div class="awning--bottom" aria-hidden="true">
    <div class="stripe-row">
      <span></span><span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span><span></span><span></span>
    </div>
  </div>

  <footer>
    <p>&copy; <span id="year"></span> Arnold's Cafe LLC. All rights reserved.</p>
  </footer>

  <script>
    (function () {
      var c = window.SITE_CONFIG;
      var isOpen = c.STATUS === "open";

      document.getElementById("headline").textContent = isOpen ? c.HEADLINE_OPEN : c.HEADLINE_COMING_SOON;
      document.getElementById("subtext").textContent = isOpen ? c.SUBTEXT_OPEN : c.SUBTEXT_COMING_SOON;
      document.getElementById("opening-pill").textContent = isOpen ? "Open now" : c.OPENING_WINDOW;
      document.getElementById("location-pill").textContent = c.ADDRESS + " · " + c.CITY_STATE;

      var emailLink = document.getElementById("email-link");
      emailLink.textContent = c.EMAIL;
      emailLink.href = "mailto:" + c.EMAIL;

      var igLink = document.getElementById("instagram-link");
      igLink.textContent = c.INSTAGRAM_HANDLE;
      igLink.href = c.INSTAGRAM_URL;

      document.getElementById("year").textContent = new Date().getFullYear();

      if (isOpen && c.HOURS && c.HOURS.length) {
        var hoursEl = document.getElementById("hours");
        hoursEl.style.display = "block";
        c.HOURS.forEach(function (h) {
          var row = document.createElement("div");
          row.className = "hours-row";
          row.innerHTML = '<span class="day"></span><span class="time"></span>';
          row.querySelector(".day").textContent = h.day;
          row.querySelector(".time").textContent = h.time;
          hoursEl.appendChild(row);
        });
      }

      document.title = isOpen ? "Arnold's Cafe — Open Now" : "Arnold's Cafe — Coming Soon";
    })();
  </script>
</body>
</html>
